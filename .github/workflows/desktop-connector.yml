name: Desktop Connector

on:
  push:
    paths:
      - 'desktop-connector/**'
      - '.github/workflows/desktop-connector.yml'
  pull_request:
    paths:
      - 'desktop-connector/**'
      - '.github/workflows/desktop-connector.yml'

jobs:
  build-windows-connector:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-connector/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run package:windows
      - name: Verify Windows executable
        shell: pwsh
        run: |
          $artifact = Get-Item "release/fluxa-desktop-connector.exe" -ErrorAction Stop
          if ($artifact.Extension -ne ".exe") { throw "Connector artifact is not a Windows executable." }
          if ($artifact.Length -lt 20MB) { throw "Connector executable is unexpectedly small ($($artifact.Length) bytes); refusing to upload a JavaScript-only artifact." }
          $magic = [System.IO.File]::ReadAllBytes($artifact.FullName)[0..1]
          if ($magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) { throw "Connector artifact is not a PE executable." }
          Write-Host "FLUXA Windows Connector: $($artifact.FullName) ($([math]::Round($artifact.Length / 1MB, 2)) MB)"
      - uses: actions/upload-artifact@v4
        with:
          name: FLUXA-Windows-Connector
          path: desktop-connector/release/fluxa-desktop-connector.exe
          if-no-files-found: error
